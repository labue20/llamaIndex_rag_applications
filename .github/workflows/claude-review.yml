name: Claude Code Review

# Claude reviews every pull request into master and posts its findings as
# comments on the PR. Needs the Claude GitHub App installed on the repository
# (https://github.com/apps/claude) and a CLAUDE_CODE_OAUTH_TOKEN repository
# secret (from `claude setup-token`). Until the secret exists, the review is
# skipped instead of failing.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]

# A new push to the PR replaces any review still running for it
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip when Claude isn't connected yet
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::Skipping Claude review - add the CLAUDE_CODE_OAUTH_TOKEN repository secret to enable it."

      - uses: actions/checkout@v6
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
