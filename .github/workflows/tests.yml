name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llama_index_web_app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: llama_index_web_app/server/requirements*.txt
      - name: Install LibreOffice (Word to PDF conversion)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Frontend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llama_index_web_app/rag-web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: llama_index_web_app/rag-web-app/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
